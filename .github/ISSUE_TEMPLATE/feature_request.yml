
name: Feature Request
description: Suggest an idea or enhancement for smart contracts
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: input
    id: contract-component
    attributes:
      label: Contract / Component Affected
      description: Name of the contract or component where the feature should be added
      placeholder: e.g., VestingVault, StakingContract
    validations:
      required: true
  - type: textarea
    id: problem-statement
    attributes:
      label: Problem Statement
      description: Describe the problem this feature is solving
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or enhancement
    validations:
      required: true
  - type: textarea
    id: security-assessment
    attributes:
      label: Security Implications Assessment
      description: Describe any security implications or considerations
