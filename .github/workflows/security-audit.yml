name: Dependency Security Audit

on:
  push:
    branches: [main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".cargo/deny.toml"
      - ".github/workflows/security-audit.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/audit.toml"
      - ".cargo/deny.toml"
      - ".github/workflows/security-audit.yml"
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  security-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust tooling
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependency audit tools
        run: |
          cargo install cargo-audit --locked
          cargo install cargo-deny --locked

      - name: Audit high and critical vulnerabilities
        id: audit
        continue-on-error: true
        run: cargo audit --json > cargo-audit.json

      - name: Enforce license and duplicate dependency policy
        id: policy
        continue-on-error: true
        run: cargo deny --config .cargo/deny.toml check licenses bans

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-audit-report
          path: cargo-audit.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail when dependency checks fail
        if: always() && (steps.audit.outcome != 'success' || steps.policy.outcome != 'success')
        run: exit 1
