name: Smart Contracts CI

on:
  push:
    branches: [ "main", "develop", "feat/*", "fix/*", "chore/*", "release/*" ]
    paths:
      - "contracts/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
  pull_request:
    branches: [ "main", "develop", "release/*" ]
    paths:
      - "contracts/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-contributing:
    name: Validate CONTRIBUTING.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check CONTRIBUTING.md exists
        run: |
          if [ ! -f "CONTRIBUTING.md" ]; then
            echo "ERROR: CONTRIBUTING.md not found"
            exit 1
          fi
          echo "CONTRIBUTING.md exists"

  validate-pr-title:
    name: Validate PR Title (Optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate Conventional Commits
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "Validating PR title: $PR_TITLE"
          
          # Conventional commits pattern: type(scope): subject
          # Using grep for better compatibility
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf|ci)(\(.+\))?: .+'; then
            echo "WARNING: PR title does not follow conventional commits format"
            echo "Expected format: type(scope): subject"
            echo "Example: feat(vault): add claim function"
            exit 1
          fi
          
          echo "PR title follows conventional commits format"

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: Validate Solidity interface sync
        run: scripts/sync-interfaces.sh --check
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          target: wasm32v1-none
          components: rustfmt, clippy

      - name: Install Stellar CLI
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          set -euo pipefail
          VERSION="25.1.0"
          ARCHIVE="stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/${ARCHIVE}"
          wget "${URL}" -O "${ARCHIVE}"
          BIN_PATH="$(tar -tzf "${ARCHIVE}" | grep -E '(^|/)stellar(-cli)?$' | head -n 1 || true)"
          if [ -z "${BIN_PATH}" ]; then
            echo "Could not locate stellar CLI binary"
            exit 1
          fi
          tar -xzf "${ARCHIVE}"
          sudo install -m 0755 "${BIN_PATH}" /usr/local/bin/stellar
          stellar --version

      - name: Build Contract
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          cargo clean
          cargo build --target wasm32v1-none --release

      - name: Contract Safety Checks
        run: |
          chmod +x scripts/contract-safety.sh
          ./scripts/contract-safety.sh

      - name: Run Clippy with Strict Settings
        run: |
          cargo clippy --all-targets --all-features -- -D warnings -W clippy::all -W clippy::pedantic

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Scan for Unsafe Patterns
        run: |
          # Check for unwrap/expect in production code (non-test files)
          if grep -r "\.unwrap()\|\.expect(" contracts --include="*.rs" \
            | grep -v "/tests/" | grep -v "test_" | grep -v "formal_reentrancy"; then
            echo "ERROR: Found unwrap()/expect() in production code"
            exit 1
          fi
          echo "✓ No unwrap()/expect() found in production code"

      - name: Verify Access Control
        run: |
          echo "Verifying all public contract functions have access control patterns..."
          # This is more of a documentation/review check
          cargo test --workspace

      - name: Run Formal Reentrancy Verification
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          cargo test -p vesting_contracts formal_reentrancy -- --nocapture

      - name: Run Unit Tests
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          cargo test --workspace
          cargo test --all-features

  fuzz-test:
    name: Fuzz & Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          target: wasm32v1-none

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz || true

      - name: Run Property-Based Tests
        continue-on-error: true
        run: |
          cargo test --workspace --features proptest || true

      - name: Run Fuzz Tests (Limited Iterations)
        continue-on-error: true
        run: |
          cargo fuzz list || echo "No fuzz targets found"
          for target in $(cargo fuzz list 2>/dev/null); do
            echo "Running fuzz target: $target"
            cargo fuzz run $target -- -max_total_time=30 || true
          done

      - name: Run Invariant Tests
        run: |
          cargo test --workspace -- --nocapture

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          target: wasm32v1-none

      - name: Quick Build Check
        run: cargo build --target wasm32v1-none --release

      - name: Quick Test
        run: cargo test --workspace -- --test-threads=4
