name: Smart Contracts CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  pr-template-check:
    name: PR Template Compliance
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check PR body follows template structure
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            const requiredSections = [
              { heading: '## Contract(s) Affected',   pattern: /##\s*Contract\(s\) Affected/i },
              { heading: '## Type of Change',          pattern: /##\s*Type of Change/i },
              { heading: '## Testing Done',            pattern: /##\s*Testing Done/i },
              { heading: '## Security Implications',   pattern: /##\s*Security Implications/i },
              { heading: '## Gas / Performance Impact',pattern: /##\s*Gas\s*\/\s*Performance Impact/i },
              { heading: '## Migration / Upgrade Considerations', pattern: /##\s*Migration\s*\/\s*Upgrade Considerations/i },
              { heading: '## Documentation Updated',  pattern: /##\s*Documentation Updated/i },
            ];

            const missingSections = requiredSections
              .filter(s => !s.pattern.test(body))
              .map(s => s.heading);

            if (missingSections.length > 0) {
              core.setFailed(
                `PR body is missing the following required template sections:\n` +
                missingSections.map(s => `  • ${s}`).join('\n') + '\n\n' +
                `Please use the PR template at .github/PULL_REQUEST_TEMPLATE.md.`
              );
            } else {
              core.info('✅ All required template sections are present.');
            }

      - name: Security checklist compliance (informational)
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            const securityItems = [
              'Reentrancy',
              'Overflow / Underflow',
              'Access Control',
              'Input Validation',
              'Storage / Data Integrity',
              'Event Emission',
              'Upgrade Safety',
              'Denial of Service',
              'No new security implications',
            ];

            // Look for checked boxes (- [x]) OR the "no new security implications" acknowledgement
            const checkedPattern = /- \[x\]/gi;
            const checkedCount   = (body.match(checkedPattern) || []).length;

            const securitySectionMatch = body.match(
              /##\s*Security Implications[\s\S]*?(?=\n## |\n---\s*$|$)/i
            );
            const securitySection = securitySectionMatch ? securitySectionMatch[0] : '';

            const uncheckedItems = securityItems.filter(item => {
              // Item is present in the security section but NOT checked
              const itemPattern = new RegExp(`- \\[ \\].*${item}`, 'i');
              return itemPattern.test(securitySection);
            });

            if (uncheckedItems.length > 0) {
              core.warning(
                `ℹ️  The following security checklist items are not yet checked:\n` +
                uncheckedItems.map(i => `  • ${i}`).join('\n') + '\n\n' +
                `This is informational only — please review and tick each item or explain why it does not apply.`
              );
            } else {
              core.info('✅ Security checklist is complete.');
            }

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: 1.91.0
          target: wasm32v1-none
          override: true
          components: rustfmt, clippy

      - name: Install Stellar CLI
        run: |
          wget https://github.com/stellar/stellar-cli/releases/download/v25.1.0/stellar-cli-25.1.0-x86_64-unknown-linux-gnu.tar.gz
          tar -xzf stellar-cli-25.1.0-x86_64-unknown-linux-gnu.tar.gz
          sudo mv stellar /usr/local/bin/
          set -euo pipefail

          VERSION="25.1.0"
          ARCHIVE="stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/${ARCHIVE}"

          wget "${URL}" -O "${ARCHIVE}"

          # Package layout has changed across versions; locate the binary from the archive contents.
          BIN_PATH="$(tar -tzf "${ARCHIVE}" | grep -E '(^|/)stellar(-cli)?$' | head -n 1 || true)"
          if [ -z "${BIN_PATH}" ]; then
            echo "Could not locate stellar CLI binary in ${ARCHIVE}"
            tar -tzf "${ARCHIVE}"
            exit 1
          fi

          tar -xzf "${ARCHIVE}"

          sudo install -m 0755 "${BIN_PATH}" /usr/local/bin/stellar
          stellar --version

      - name: Build Contract
        run: |
          cargo clean
          cargo build --target wasm32v1-none --release

      - name: Run Formal Reentrancy Verification
        run: |
          cargo test -p vesting_contracts formal_reentrancy -- --nocapture

      - name: Run Unit Tests
        run: |
          cargo test --workspace
          cargo test --all-features
