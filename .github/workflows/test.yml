name: Smart Contracts CI

on:
  push:
    branches: [ "main", "develop", "feat/*", "fix/*", "chore/*", "release/*" ]
    paths:
      - "contracts/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - "scripts/**"
      - "rust-toolchain.toml"
  pull_request:
    branches: [ "main", "develop", "release/*" ]
    paths:
      - "contracts/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/**"
      - "scripts/**"
      - "rust-toolchain.toml"

  workflow_dispatch:
    inputs:
      deploy_testnet:
        description: "Build workspace Wasm artifacts and deploy them to Stellar testnet"
        required: true
        type: boolean
        default: false
      smoke_contract:
        description: "Workspace contract artifact stem used for the smoke probe"
        required: true
        type: string
        default: "grant_contracts"
      smoke_init_args_json:
        description: "JSON argv for the state-changing initialization probe"
        required: true
        type: string
        default: '["initialize_grant","--recipient","__SOURCE_ACCOUNT__","--total_amount","1000","--duration_seconds","1"]'
      smoke_claim_args_json:
        description: "JSON argv for the claim-path probe"
        required: true
        type: string
        default: '["claim","--recipient","__SOURCE_ACCOUNT__"]'
      smoke_claim_send:
        description: "Send the claim-path probe instead of simulation-only"
        required: true
        type: boolean
        default: true
      smoke_claim_wait_seconds:
        description: "Seconds to allow the testnet ledger to advance before the claim probe"
        required: true
        type: number
        default: 10
      max_resource_fee_stroops:
        description: "Maximum simulated Soroban resource fee for smoke probes (stroops)"
        required: true
        type: number
        default: 2000000

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  validate-contributing:
    name: Validate CONTRIBUTING.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Check CONTRIBUTING.md exists
        run: |
          if [ ! -f "CONTRIBUTING.md" ]; then
            echo "ERROR: CONTRIBUTING.md not found"
            exit 1
          fi
          echo "CONTRIBUTING.md exists"

  validate-pr-title:
    name: Validate PR Title (Optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3
      
      - name: Validate Conventional Commits
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          echo "Validating PR title: $PR_TITLE"
          
          # Conventional commits pattern: type(scope): subject
          # Using grep for better compatibility
          if ! echo "$PR_TITLE" | grep -qE '^(feat|fix|docs|style|refactor|test|chore|perf|ci)(\(.+\))?: .+'; then
            echo "WARNING: PR title does not follow conventional commits format"
            echo "Expected format: type(scope): subject"
            echo "Example: feat(vault): add claim function"
            exit 1
          fi
          
          echo "PR title follows conventional commits format"

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v3

      - name: Validate Solidity interface sync
        run: scripts/sync-interfaces.sh --check
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          target: wasm32v1-none
          components: rustfmt, clippy

      - name: Install Stellar CLI
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          set -euo pipefail
          VERSION="25.1.0"
          ARCHIVE="stellar-cli-${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          URL="https://github.com/stellar/stellar-cli/releases/download/v${VERSION}/${ARCHIVE}"
          wget "${URL}" -O "${ARCHIVE}"
          BIN_PATH="$(tar -tzf "${ARCHIVE}" | grep -E '(^|/)stellar(-cli)?$' | head -n 1 || true)"
          if [ -z "${BIN_PATH}" ]; then
            echo "Could not locate stellar CLI binary"
            exit 1
          fi
          tar -xzf "${ARCHIVE}"
          sudo install -m 0755 "${BIN_PATH}" /usr/local/bin/stellar
          stellar --version

      - name: Build Contract
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          cargo clean
          cargo build --target wasm32v1-none --release

      - name: Contract Safety Checks
        run: |
          chmod +x scripts/contract-safety.sh
          ./scripts/contract-safety.sh

      - name: Run Clippy with Strict Settings
        run: |
          cargo clippy --all-targets --all-features -- -D warnings -W clippy::all -W clippy::pedantic

      - name: Check Code Formatting
        run: cargo fmt --all -- --check

      - name: Scan for Unsafe Patterns
        run: |
          # Check for unwrap/expect in production code (non-test files)
          if grep -r "\.unwrap()\|\.expect(" contracts --include="*.rs" \
            | grep -v "/tests/" | grep -v "test_" | grep -v "formal_reentrancy"; then
            echo "ERROR: Found unwrap()/expect() in production code"
            exit 1
          fi
          echo "✓ No unwrap()/expect() found in production code"

      - name: Verify Access Control
        run: |
          echo "Verifying all public contract functions have access control patterns..."
          # This is more of a documentation/review check
          cargo test --workspace

      - name: Run Formal Reentrancy Verification
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          cargo test -p vesting_contracts formal_reentrancy -- --nocapture

      - name: Run Unit Tests
        if: steps.check-contracts.outputs.contracts_changed == 'true'
        run: |
          cargo test --workspace
          cargo test --all-features

  fuzz-test:
    name: Fuzz & Property-Based Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          target: wasm32v1-none

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz || true

      - name: Run Property-Based Tests
        continue-on-error: true
        run: |
          cargo test --workspace --features proptest || true

      - name: Run Fuzz Tests (Limited Iterations)
        continue-on-error: true
        run: |
          cargo fuzz list || echo "No fuzz targets found"
          for target in $(cargo fuzz list 2>/dev/null); do
            echo "Running fuzz target: $target"
            cargo fuzz run $target -- -max_total_time=30 || true
          done

      - name: Run Invariant Tests
        run: |
          cargo test --workspace -- --nocapture

  smoke-test:
    name: Smoke Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.0
          target: wasm32v1-none

      - name: Quick Build Check
        run: cargo build --target wasm32v1-none --release

      - name: Quick Test
        run: cargo test --workspace -- --test-threads=4


  soroban-build:
    name: Soroban workspace build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain declared by rust-toolchain.toml
        shell: bash
        run: |
          mapfile -t toolchain_config < <(python3 - <<'PY'
          import tomllib
          with open("rust-toolchain.toml", "rb") as handle:
              config = tomllib.load(handle)["toolchain"]
          print(config["channel"])
          print(" ".join(config.get("targets", [])))
          print(" ".join(config.get("components", [])))
          PY
          )
          toolchain="${toolchain_config[0]}"
          rustup toolchain install "${toolchain}" --profile minimal
          for target in ${toolchain_config[1]}; do
            rustup target add "${target}" --toolchain "${toolchain}"
          done
          for component in ${toolchain_config[2]}; do
            rustup component add "${component}" --toolchain "${toolchain}"
          done
          rustup override set "${toolchain}"
          rustc --version
          cargo --version

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features

      - name: Workspace tests
        run: |
          # Each contract enables soroban-sdk/testutils through dev-dependencies.
          # There is no workspace-level "testutils" feature to pass to cargo.
          cargo test --workspace

      - name: Build Soroban Wasm artifacts
        run: cargo build --workspace --target wasm32v1-none --release

      - name: Collect Wasm and enforce artifact budget
        env:
          MAX_WASM_BYTES: "262144"
        run: |
          mkdir -p ci-wasm
          while IFS= read -r -d '' wasm; do
            cp "${wasm}" ci-wasm/
          done < <(find target/wasm32v1-none/release -maxdepth 1 -type f -name '*.wasm' -print0 | sort -z)
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path("ci-wasm")
          files = sorted(root.glob("*.wasm"))
          if not files:
              raise SystemExit("no Soroban Wasm artifacts were produced")

          ceiling = int(os.environ["MAX_WASM_BYTES"])
          oversize = []
          for wasm in files:
              size = wasm.stat().st_size
              print(f"{wasm.name}: {size} bytes")
              if size > ceiling:
                  oversize.append((wasm.name, size))

          if oversize:
              details = ", ".join(f"{name}={size}" for name, size in oversize)
              raise SystemExit(f"Wasm artifact budget exceeded ({ceiling} bytes): {details}")
          PY

      - name: Upload Soroban Wasm artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soroban-wasm
          path: ci-wasm/*.wasm
          if-no-files-found: error

  soroban-testnet-deploy:
    name: Manual Stellar testnet deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_testnet }}
    needs: soroban-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      STELLAR_TESTNET_SECRET_KEY: ${{ secrets.STELLAR_TESTNET_SECRET_KEY }}
      STELLAR_TESTNET_ACCOUNT: ${{ secrets.STELLAR_TESTNET_ACCOUNT }}
      MAX_RESOURCE_FEE_STROOPS: ${{ inputs.max_resource_fee_stroops }}
      SMOKE_CONTRACT: ${{ inputs.smoke_contract }}
      SMOKE_INIT_ARGS_JSON: ${{ inputs.smoke_init_args_json }}
      SMOKE_CLAIM_ARGS_JSON: ${{ inputs.smoke_claim_args_json }}
      SMOKE_CLAIM_SEND: ${{ inputs.smoke_claim_send }}
      SMOKE_CLAIM_WAIT_SECONDS: ${{ inputs.smoke_claim_wait_seconds }}
    steps:
      - uses: actions/checkout@v4

      - name: Download Soroban Wasm artifacts
        uses: actions/download-artifact@v4
        with:
          name: soroban-wasm
          path: ci-wasm

      - name: Install Stellar CLI
        shell: bash
        run: |
          set -euo pipefail
          version="25.1.0"
          archive="stellar-cli-${version}-x86_64-unknown-linux-gnu.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/stellar/stellar-cli/releases/download/v${version}/${archive}" \
            --output "${archive}"
          binary_path="$(tar -tzf "${archive}" | grep -E '(^|/)stellar(-cli)?$' | head -n 1)"
          test -n "${binary_path}"
          tar -xzf "${archive}"
          sudo install -m 0755 "${binary_path}" /usr/local/bin/stellar
          stellar --version

      - name: Validate testnet credentials
        shell: bash
        run: |
          test -n "${STELLAR_TESTNET_SECRET_KEY}" || {
            echo "STELLAR_TESTNET_SECRET_KEY is required" >&2
            exit 1
          }
          test -n "${STELLAR_TESTNET_ACCOUNT}" || {
            echo "STELLAR_TESTNET_ACCOUNT is required" >&2
            exit 1
          }
          case "${STELLAR_TESTNET_ACCOUNT}" in
            G*) ;;
            *)
              echo "STELLAR_TESTNET_ACCOUNT must be a public G... account" >&2
              exit 1
              ;;
          esac
          if ! [[ "${MAX_RESOURCE_FEE_STROOPS}" =~ ^[1-9][0-9]*$ ]]; then
            echo "max_resource_fee_stroops must be a positive integer" >&2
            exit 1
          fi

      - name: Deploy workspace contracts
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          : > testnet-deployments.txt
          selected_contract_id=""
          while IFS= read -r -d '' wasm; do
            stem="$(basename "${wasm}" .wasm)"
            contract_id="$(
              stellar contract deploy \
                --wasm "${wasm}" \
                --source-account "${STELLAR_TESTNET_SECRET_KEY}" \
                --network testnet
            )"
            printf '%s=%s\n' "${stem}" "${contract_id}" | tee -a testnet-deployments.txt
            if [[ "${stem}" == "${SMOKE_CONTRACT}" ]]; then
              selected_contract_id="${contract_id}"
            fi
          done < <(find ci-wasm -maxdepth 1 -type f -name '*.wasm' -print0 | sort -z)

          if [[ -z "${selected_contract_id}" ]]; then
            echo "Smoke contract artifact not found: ${SMOKE_CONTRACT}" >&2
            exit 1
          fi
          echo "contract_id=${selected_contract_id}" >> "${GITHUB_OUTPUT}"

      - name: Run initialization and claim-path smoke probe
        shell: bash
        run: |
          claim_send="no"
          if [[ "${SMOKE_CLAIM_SEND}" == "true" ]]; then
            claim_send="yes"
          fi
          python3 scripts/testnet-smoke.py \
            --contract-id "${{ steps.deploy.outputs.contract_id }}" \
            --source "${STELLAR_TESTNET_SECRET_KEY}" \
            --account "${STELLAR_TESTNET_ACCOUNT}" \
            --network testnet \
            --max-resource-fee "${MAX_RESOURCE_FEE_STROOPS}" \
            --init-json "${SMOKE_INIT_ARGS_JSON}" \
            --claim-json "${SMOKE_CLAIM_ARGS_JSON}" \
            --claim-send "${claim_send}" \
            --claim-wait-seconds "${SMOKE_CLAIM_WAIT_SECONDS}"

      - name: Upload deployment manifest
        uses: actions/upload-artifact@v4
        with:
          name: stellar-testnet-deployments
          path: testnet-deployments.txt
          if-no-files-found: error
