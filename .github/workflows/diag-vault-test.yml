name: diag-vesting-vault-test
on:
  push:
    branches:
      - fix/issue-3-packed-storage-keys
jobs:
  vault-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: branch lib tests (in-scope)
        run: cargo test -p vesting_vault --lib -- --nocapture
      - name: branch full package tests (documents known upstream breakage)
        run: cargo test -p vesting_vault -- --nocapture
        continue-on-error: true
      - name: upstream-base full package tests (pre-existing breakage check)
        run: |
          git checkout ade96d48d67773828350d791fc4d49604435c47c
          cargo test -p vesting_vault -- --nocapture
        continue-on-error: true
